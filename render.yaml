# Render Blueprint: one free web service. When you create it, Render asks for the three
# secret values (BOT_TOKEN, TG_API_ID, TG_API_HASH) - nothing else has to be typed.
services:
  - type: web
    name: video-re-editor
    runtime: docker
    plan: free
    region: frankfurt
    branch: claude/great-franklin-xpqj4a
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      # always: never sleep. A sleeping free instance answers Telegram's webhook with 502.
      - key: KEEP_AWAKE
        value: always
      # the free instance has 0.1 CPU and 512 MB: 720p, fast encoder, light filters
      - key: CPU_PROFILE
        value: lite
