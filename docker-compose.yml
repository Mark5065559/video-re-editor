services:
  video-re-editor:
    build: .
    container_name: video-re-editor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      # Named volume: Docker creates it with the right owner for the container user,
      # so it also works on Linux servers (a ./data bind mount would be owned by root).
      - botdata:/data
    init: true
    stop_grace_period: 30s

volumes:
  botdata:
